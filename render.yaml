services:
  - type: web
    name: nexplay-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Supabase session-pooler URI in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://nexplay.vercel.app
