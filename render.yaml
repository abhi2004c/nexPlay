services:
  - type: web
    name: nexplay-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    # ONE worker with several threads: the chat's instant delivery shares memory between requests
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 60
    healthCheckPath: /api/health/
    region: singapore # only applies when the service is created; closest Render region to Supabase Tokyo
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Supabase session-pooler URI in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://nexplay.vercel.app
