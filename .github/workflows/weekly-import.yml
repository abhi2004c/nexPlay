# Every Monday: add the next 50 most popular movies and 50 most popular games that are not in the
# database yet (TMDB / RAWG), then fill in their IMDb ratings. Can also be started by hand from the
# repository's Actions tab ("Run workflow"), where the numbers can be changed.
name: Weekly title import

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      movies:
        description: 'How many new movies'
        default: '50'
      games:
        description: 'How many new games'
        default: '50'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the secrets are set
        run: |
          missing=0
          for v in DATABASE_URL TMDB_API_KEY RAWG_API_KEY OMDB_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is empty or missing (repo Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          exit $missing
      - name: Import new titles
        run: python manage.py import_titles --movies ${{ github.event.inputs.movies || 50 }} --games ${{ github.event.inputs.games || 50 }} --new-only
      - name: IMDb ratings for the new movies
        run: python manage.py backfill_imdb
